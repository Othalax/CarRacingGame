repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        types_or: [c++, c]
        args: [-i, --Werror, --style=file]

      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        types_or: [c++, c]
        args:
          - --config-file=.clang-tidy
